[project]
name = "multilingual-rag-de-en"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "faiss-cpu>=1.15.1",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
]

[project.scripts]
rag-ingest = "multilingual_rag.ingestion.cli:main"
rag-index = "multilingual_rag.retrieval.cli:main"
rag-eval = "multilingual_rag.evaluation.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
